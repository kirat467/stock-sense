<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense - Receipts</title>
    <link rel="stylesheet" href="receipts.css">
</head>

<body>

    <div class="page-container">

        <h1>Receipts</h1>
        <p>Receive products and increase inventory stock.</p>

        <button id="backBtn">← Dashboard</button>

        <hr>

        <h2>Create Receipt</h2>

        <form id="receiptForm">

            <label>Product</label>
            <select id="productSelect" required>
                <option value="">Select Product</option>
            </select>

            <br><br>

            <label>Quantity Received</label>
            <input
                type="number"
                id="quantity"
                min="1"
                required
            >

            <br><br>

            <label>Supplier</label>
            <input
                type="text"
                id="supplier"
                placeholder="Supplier name"
                required
            >

            <br><br>

            <button type="submit">Validate Receipt</button>

        </form>

    </div>

    <script type="module" src="receipts.js"></script>

</body>
</html>
